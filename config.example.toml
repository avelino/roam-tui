[graph]
name = "your-graph-name"
api_token = ""  # or set ROAM_API_TOKEN env var

# Local API (requires Roam desktop app running — faster, fewer network requests)
# local_api = false      # set to true to use local API
# local_api_port = 7070  # port for the Roam local API server

[ui]
theme = "dark"            # dark | light
sidebar_default = true    # show backlinks on startup
sidebar_width_percent = 35

[keybindings]
preset = "vim"            # vim | emacs | vscode

# Override specific keys:
# [keybindings.bindings]
# quit = "Ctrl+q"
# search = "Ctrl+f"
